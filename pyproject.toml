[project]
name = "edgar-deepseek"
version = "0.1.0"
description = "Reproduction tools for running EDGAR with OpenCode Go models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==0.51.0",
    "google-genai==1.19.0",
    "httpx==0.28.1",
    "jax==0.6.0",
    "jaxopt==0.8.5",
    "matplotlib==3.10.3",
    "numpy==2.2.5",
    "optax==0.2.4",
    "pandas==2.2.3",
    "pillow==11.2.1",
    "python-dotenv==1.1.0",
    "scipy==1.15.3",
    "timeout-decorator==0.5.0",
    "tqdm==4.65.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_study"]

[project.scripts]
edgar = "edgar_study.cli:main"

[dependency-groups]
dev = [
    "wills-agentic-tools",
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.5",
    "ty==0.0.78",
]

[tool.uv.sources]
wills-agentic-tools = { git = "https://github.com/wd7512/wills-agentic-tools", tag = "v0.2.1" }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["src/edgar_upstream", "docs/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM117"]

[tool.ty.src]
include = ["src/edgar_study"]

[tool.ty.environment]
extra-paths = ["src/edgar_upstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 300

[tool.devtools.gate]
source = "src/edgar_study/"
tests = ["tests"]

[tool.devtools.check]
source_package = "src/edgar_study"
unit_tests = "tests/unit"
mirror_exceptions = [
    "src/edgar_study/cli.py",
    "src/edgar_study/preflight.py",
    "src/edgar_study/report.py",
    "src/edgar_study/rescore.py",
]
untracked_paths = ["data/", "results/"]
changelog_dir = "changes"
changelog_exempt = ["docs/"]
base = "origin/main"

[tool.devtools.delegate]
base = "origin/main"
gate_command = "uv run gate"
extra_rules = [
    "Never modify the six pinned upstream modules in src/edgar_upstream/.",
    "Never call paid models or pass --allow-paid.",
    "Tests must not need the dataset or an API key.",
]
